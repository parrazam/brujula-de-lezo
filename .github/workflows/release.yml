name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Build release APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Rename artifacts
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/brujula-de-lezo-${{ github.ref_name }}.apk
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/brujula-de-lezo-${{ github.ref_name }}.aab

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          echo "Using apksigner from $APKSIGNER"
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/brujula-de-lezo-${{ github.ref_name }}.apk

      # Play exige que las .so de 64 bits estén alineadas a 16 KB. La app no trae nativas propias,
      # pero Compose arrastra libandroidx.graphics.path.so; si una subida de Compose la desalinea,
      # que falle aquí y no en la consola de Play.
      - name: Verify 16 KB page alignment
        run: |
          APK=app/build/outputs/apk/release/brujula-de-lezo-${{ github.ref_name }}.apk
          # Sin el APK tiene que fallar: antes cualquier error de unzip pasaba por «sin nativas».
          [ -f "$APK" ] || { echo "::error::No se encuentra $APK"; exit 1; }
          if ! unzip -Z1 "$APK" | grep '^lib/' > /dev/null; then echo "Sin bibliotecas nativas"; exit 0; fi
          rm -rf so-check && unzip -q "$APK" 'lib/*' -d so-check
          fail=0
          for so in so-check/lib/arm64-v8a/*.so so-check/lib/x86_64/*.so; do
            [ -e "$so" ] || continue
            for align in $(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}'); do
              if [ $((align)) -lt $((0x4000)) ]; then echo "::error::$so tiene un segmento LOAD alineado a $align"; fail=1; fi
            done
            echo "$so OK"
          done
          exit $fail

      # La action no lee la anotación del tag por su cuenta: hasta ahora la release salía solo
      # con las notas automáticas aunque el tag tuviera mensaje. Se pide a la API y no a git
      # porque actions/checkout puede dejar el tag como ligero. Un tag ligero da cuerpo vacío.
      - name: Release notes from annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")
          : > release-notes.md
          if [ "$(jq -r .object.type <<<"$ref")" = "tag" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .message |
              awk '
                # Primera línea → título (##); línea suelta seguida de una lista → sección (###).
                /^-----BEGIN (PGP|SSH) SIGNATURE-----/ { exit }
                { lines[NR] = $0 }
                END {
                  for (i = 1; i <= NR; i++) {
                    l = lines[i]
                    if (i == 1) { print "## " l; continue }
                    if (l != "" && l !~ /^[- ]/ && lines[i-1] == "" && lines[i+1] ~ /^- /) { print "### " l; continue }
                    print l
                  }
                }' > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Brújula de Lezo ${{ github.ref_name }}"
          # El input es generate_release_notes (con generate_notes la action lo ignoraba en
          # silencio). Las notas automáticas (PRs desde el tag anterior) van debajo del body.
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/brujula-de-lezo-${{ github.ref_name }}.apk
            app/build/outputs/bundle/release/brujula-de-lezo-${{ github.ref_name }}.aab

      - name: Clean up keystore
        if: always()
        run: rm -f keystore/release.jks
